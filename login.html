<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar – English Fun</title>
</head>
<body>
<p><a href="index.html">← Menu</a></p>
<h1>🦉 Entrar</h1>
<form action="index.html" method="get">
<p><label>Seu nome: <input type="text" required minlength="3" maxlength="12" pattern="[A-Za-z0-9_À-ÿ]+" title="Use de 3 a 12 letras ou números, sem espaços." autocomplete="username"></label></p>
<p><label>Senha: <input type="password" required minlength="4" autocomplete="current-password"></label></p>

<p><button type="submit">Entrar</button></p>
</form>
<p><small>Aviso: em HTML puro o site não consegue guardar contas. Estas telas só conferem se os campos foram preenchidos certinho.</small></p>
<p>Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
</body>
</html>
